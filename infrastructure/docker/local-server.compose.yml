# JARVIS MK.43 local-server dev stack.
# Brings up the Data Plane: PostgreSQL (+pgvector), Redis, NATS (JetStream),
# MinIO, and an OpenTelemetry collector. The Kernel (apps/core) runs on the
# host during development (pnpm core:dev) and connects to these.
#
#   pnpm stack:up      start
#   pnpm stack:down    stop (keep volumes)
#   pnpm stack:reset   stop + delete volumes

name: jarvis-mk43

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: jarvis
      MINIO_ROOT_PASSWORD: jarvis-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ../observability/loki.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports: ["127.0.0.1:3200:3200"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempodata:/var/tempo
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["127.0.0.1:3300:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
  postgres-exporter:
    depends_on:
      postgres:
        condition: service_healthy
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://jarvis:jarvis@postgres:5432/jarvis?sslmode=disable"
  redis-exporter:
    depends_on:
      redis:
        condition: service_healthy
    image: oliver006/redis_exporter:v1.62.0
    command: ["--redis.addr=redis://redis:6379"]
  nats-exporter:
    depends_on:
      nats:
        condition: service_healthy
    image: natsio/prometheus-nats-exporter:0.15.0
    command: ["-varz", "-connz", "-jsz=all", "http://nats:8222"]

volumes:
  prometheusdata:
  lokidata:
  tempodata:
  grafanadata:
  pgdata:
  natsdata:
  miniodata:
