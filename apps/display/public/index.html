<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS · Wall</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#04090f;color:#c6d5df}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(1100px,88vw);padding:6vh 0}header,footer{display:flex;justify-content:space-between;gap:2rem;color:#758b9b;font-size:14px;letter-spacing:.15em}time{font-size:clamp(42px,6vw,82px);font-weight:200;letter-spacing:.02em}.core{margin:5vh auto;width:clamp(150px,23vw,260px);aspect-ratio:1;border:1px solid #245779;border-radius:50%;box-shadow:0 0 65px #126b9730,inset 0 0 45px #14648928;display:grid;place-content:center;text-align:center}.core strong{font-size:23px;font-weight:400;letter-spacing:.2em}.core small{padding-top:12px;color:#698b9d;letter-spacing:.12em}#objective{text-align:center;font-weight:300;font-size:clamp(18px,2vw,27px);min-height:2em}#details{opacity:0;max-height:0;overflow:hidden;transition:opacity .7s,max-height .7s}#details.expanded{opacity:1;max-height:45vh;margin:4vh 0}.row{padding:12px;border-bottom:1px solid #132b3c;color:#9db9c8;font-size:16px}#offline{color:#e1b68a}button{background:transparent;color:#769cb1;border:1px solid #224357;border-radius:4px;padding:8px}footer{margin-top:4vh;letter-spacing:.04em}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:600px){header,footer{font-size:11px;gap:1rem}.row{font-size:13px}}
</style>
<main><header><span>JARVIS / MARK 42</span><span id="health">Connecting</span></header><time id="clock"></time><div class="core"><strong>MARK 42</strong><small id="mode">CORE</small></div><p id="objective">Awaiting Kernel</p><section id="details" aria-live="polite"></section><footer><span id="pulse">Business pulse unavailable</span><span id="meeting">Next meeting unavailable</span><button id="expand">Show activity</button></footer><p id="offline" role="status"></p></main>
<script>
const el=id=>document.getElementById(id);let last='',expandedUntil=0,lastNotification='';
function row(text){const r=document.createElement('div');r.className='row';r.textContent=text;el('details').append(r)}
el('expand').onclick=()=>{expandedUntil=Date.now()+20000};
async function tick(){el('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});try{const response=await fetch('/state',{cache:'no-store'});if(!response.ok)throw Error();const s=await response.json();if(!s.live||Date.now()-s.receivedAt>20000){el('offline').textContent='Disconnected · live status unavailable';el('health').textContent='Offline';el('mode').textContent='UNAVAILABLE';el('objective').textContent='Awaiting Kernel';el('details').replaceChildren();el('pulse').textContent='Business pulse unavailable';el('meeting').textContent='Next meeting unavailable';return}el('offline').textContent='';const p=s.picture;el('health').textContent=p.health+' · '+p.work;el('mode').textContent=p.mode+' / '+p.interaction;el('objective').textContent=p.objective||'Standing by';el('pulse').textContent='Business · '+p.business.filter(r=>r.status==='available').length+' sources available';el('meeting').textContent=p.nextMeeting?'Next meeting · '+new Date(p.nextMeeting).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'}):'Next meeting unavailable';const key=JSON.stringify([p.alerts,p.workflows,p.agents,p.presented?.objectId,p.health]);if(last&&key!==last)expandedUntil=Date.now()+20000;last=key;if(s.notification?.id!==lastNotification&&s.notification){expandedUntil=Date.now()+20000;lastNotification=s.notification.id}el('details').replaceChildren();if(s.notification&&Date.now()-s.notificationAt<20000)row(s.notification.title+' · '+s.notification.body);if(p.presented&&Date.parse(p.presented.expiresAt)>Date.now()){row(p.presented.title);if(p.presented.summary)row(p.presented.summary);p.presented.resourceRefs.forEach(row);expandedUntil=Math.max(expandedUntil,Date.parse(p.presented.expiresAt))}p.alerts.forEach(()=>row('Important alert · review on a personal surface'));p.agents.forEach(a=>row(a.id+' · '+a.state));p.workflows.forEach(w=>row(w.action+' · '+w.state));el('details').classList.toggle('expanded',Date.now()<expandedUntil)}catch{el('offline').textContent='Display connection unavailable';el('health').textContent='Offline';el('mode').textContent='UNAVAILABLE';el('objective').textContent='Awaiting Kernel';el('details').replaceChildren();el('pulse').textContent='Business pulse unavailable';el('meeting').textContent='Next meeting unavailable';}finally{setTimeout(tick,1000)}}tick();
</script></html>
